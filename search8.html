<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>探索</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="search8">
    <h1>アルゴリズムの比較</h1>

    <div style="display: flex; column-gap: 50px; border: solid 3px #000000; padding: 20px; margin-top: 30px;">
        <div>
            <h3>線形探索</h3>
            <p>最小探索回数... 1回</p>
            <p>最大探索回数... n回</p>
            <p>平均探索回数... <span style="display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center;">
                    <span style="padding: 0 10px; border-bottom: 1px solid #000000;">n+1</span>
                    <span style="padding: 0 10px;">2</span>
                </span>回
            </p>
        </div>
        <div>
            <h3>二分探索</h3>
            <p>最小探索回数... 1回</p>
            <p>最大探索回数... [log₂n]+1回</p>
            <p>平均探索回数... [log₂n]回</p>
        </div>
    </div>

    <img src="graph.png" alt="" style="display: block; margin: 40px auto 0 auto; width: 60%; border: solid 3px #000000;">

    <div class="footer">
        <button onclick="location.href='search7.html'" class="btn">前ページ</button>
        <button onclick="location.href='search9.html'" class="btn">次ページ</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
